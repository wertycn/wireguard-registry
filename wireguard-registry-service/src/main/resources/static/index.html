<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8"/>
    <title>WireGuard跨云组网</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge"/>

    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/amis/3.4.0/sdk.css"/>
    <style>
        html,
        body,
        .app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
<div id="root" class="app-wrapper"></div>
<script type="text/javascript" src="https://cdn.bootcdn.net/ajax/libs/amis/3.4.0/sdk.min.js"></script>
<script type="text/javascript">
    let myAmis;
    (function () {
        myAmis = amisRequire('amis/embed');

        // 获取页面参数
        const urlParams = new URLSearchParams(window.location.search);
        const app = urlParams.get('app') || 'generate';

        // 根据 app 参数选择配置文件
        const schemaMap = {
            'generate': '/options/form.json',           // 配置生成
            'networks': '/options/network-list.json'   // 网络管理
        };

        const schemaUrl = schemaMap[app] || schemaMap['generate'];

        // 渲染页面
        let page = {
            "type": "page",
            "title": "WireGuard 配置管理",
            "aside": {
                "type": "nav",
                "stacked": true,
                "links": [
                    {
                        "label": "配置生成",
                        "icon": "fa fa-magic",
                        "to": "?app=generate",
                        "active": app === 'generate'
                    },
                    {
                        "label": "网络管理",
                        "icon": "fa fa-sitemap",
                        "to": "?app=networks",
                        "active": app === 'networks'
                    }
                ]
            },
            "body": {
                "type": "service",
                "schemaApi": "get:" + schemaUrl
            }
        };

        myAmis.embed("#root", page);
    })();
</script>
</body>
</html>
